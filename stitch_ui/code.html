<!DOCTYPE html>
<html lang="en" class="dark">
<head>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],

            brand: {

              100: '#ede9fe',
              400: '#a78bfa',
              500: '#8b5cf6',
              600: '#7c3aed',
              dark: '#0a0a14',

          },
          animation: {
            'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',

  <style>
    body {
      background-color: #06060c;
      color: #e2e8f0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow-x: hidden;
    }
    /* Custom glass effects */
    .glass-panel {
      background: rgba(13, 14, 28, 0.68);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }
    .glass-card-interactive {
      background: rgba(18, 20, 40, 0.55);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.06);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .glass-card-interactive:hover {
      background: rgba(28, 30, 58, 0.7);
      border-color: rgba(139, 92, 246, 0.35);
      transform: translateY(-2px);
      box-shadow: 0 12px 30px -10px rgba(124, 58, 237, 0.25);
    }
    .mesh-bg {
      background-image: 
        radial-gradient(circle at 10% 15%, rgba(124, 58, 237, 0.12) 0%, transparent 45%),
        radial-gradient(circle at 85% 25%, rgba(59, 130, 246, 0.1) 0%, transparent 40%),
        radial-gradient(circle at 50% 85%, rgba(236, 72, 153, 0.08) 0%, transparent 50%);

      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(10, 10, 20, 0.5);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(139, 92, 246, 0.4);
    }
    .glow-dot {
      box-shadow: 0 0 12px currentColor;
    }
    input[type=range] {
      accent-color: #8b5cf6;

</head>
<body class="min-h-screen mesh-bg selection:bg-purple-600 selection:text-white">
  <div id="root"></div>

  <!-- React Application -->
  <script type="text/babel">
    const { useState, useMemo, useEffect, useRef } = React;

    // --- Mock Data Set ---
    const FUNNEL_DATA = [
      { id: 'F1', name: 'F1: Express Intent', rate: 100, dropRate: 0, count: '1,420,800', desc: 'User types initial search term or memory clue', leakCause: 'Initial formulation barrier' },
      { id: 'F2', name: 'F2: Query Understand', rate: 84.2, dropRate: 15.8, count: '1,196,300', desc: 'AI parser extracts spatial, temporal & entity tags', leakCause: 'Semantic & synonym parsing mismatch' },
      { id: 'F3', name: 'F3: Photo Candidate Recall', rate: 61.5, dropRate: 22.7, count: '873,790', desc: 'Embedding index returns top-50 candidate photos', leakCause: 'Index misses non-indexed OCR / background details' },
      { id: 'F4', name: 'F4: Visual Recognition', rate: 43.1, dropRate: 18.4, count: '612,360', desc: 'User scans grid to recognize target among results', leakCause: 'Thumbnails too small or clutter obfuscates target' },
      { id: 'F5', name: 'F5: Query Refine Loop', rate: 26.8, dropRate: 16.3, count: '380,770', desc: 'User reformulates query with fallback filters', leakCause: 'Cognitive fatigue; memory mismatch escalation' },
      { id: 'F6', name: 'F6: Finished & Retrieved', rate: 14.4, dropRate: 12.4, count: '204,590', desc: 'Target photo opened, favorited, shared or exported', leakCause: '85.6% Total Leakage across discovery flow' }
    ];

    const MEMORY_LENSES_DATA = [
      { dimension: 'Spatial / Place', remembered: 88, forgotten: 24, userQuote: 'I remember it was near the river cafe with green parasols', category: 'Scene Context' },
      { dimension: 'Temporal (Vague)', remembered: 92, forgotten: 18, userQuote: 'Two summers ago right after graduation', category: 'Time Context' },
      { dimension: 'Social / Co-presence', remembered: 81, forgotten: 31, userQuote: 'Maya was wearing a bright yellow raincoat', category: 'Entity' },
      { dimension: 'Visual Anchor Color', remembered: 76, forgotten: 39, userQuote: 'Huge neon turquoise signage in background', category: 'Visual Cue' },
      { dimension: 'Exact Date/Month', remembered: 19, forgotten: 86, userQuote: 'No idea if it was May 14th or July 3rd', category: 'System Metadata' },
      { dimension: 'Exact Filename/Tag', remembered: 6, forgotten: 95, userQuote: 'IMG_20230812_WA0023.jpg means nothing to me', category: 'System Metadata' },
      { dimension: 'Formal Item Label', remembered: 28, forgotten: 79, userQuote: 'Searched "automobile maintenance slip", image is titled invoice', category: 'Vocabulary' },
    ];

    // Discovery Map Clusters
    const CLUSTERS = [
      { id: 1, name: 'Fuzzy Place & Ambience', color: '#8b5cf6', badge: 'bg-purple-500/20 text-purple-300 border-purple-500/40' },
      { id: 2, name: 'Utility & Document Text', color: '#38bdf8', badge: 'bg-sky-500/20 text-sky-300 border-sky-500/40' },
      { id: 3, name: 'Fleeting Serendipity', color: '#ec4899', badge: 'bg-pink-500/20 text-pink-300 border-pink-500/40' },
      { id: 4, name: 'Co-temporal Events', color: '#10b981', badge: 'bg-emerald-500/20 text-emerald-300 border-emerald-500/40' },
      { id: 5, name: 'Emotional / Sensory Cues', color: '#f59e0b', badge: 'bg-amber-500/20 text-amber-300 border-amber-500/40' },
    ];

    // Seeded synthetic 2D UMAP scatter points for Discovery Map
    const generateClusterPoints = () => {
      const points = [];
      const centers = [
        { cx: 32, cy: 38, id: 1, label: 'Fuzzy Place', quote: '"Looked like a rustic wine cellar with arched brick ceiling"' },
        { cx: 72, cy: 28, id: 2, label: 'Utility Docs', quote: '"The serial number sticker behind my dishwasher was illegible"' },
        { cx: 68, cy: 74, id: 3, label: 'Fleeting Cues', quote: '"A dog jumping through a water sprinkler mid-air during sunset"' },
        { cx: 28, cy: 76, id: 4, label: 'Co-temporal', quote: '"Photo taken right after our flight got canceled in Munich"' },
        { cx: 50, cy: 50, id: 5, label: 'Sensory Cues', quote: '"That cozy rainy afternoon with hot matcha mug in hand"' },
      ];

      centers.forEach((center) => {
        for (let i = 0; i < 48; i++) {
          const r = Math.random() * 14;
          const theta = Math.random() * 2 * Math.PI;
          const x = Math.max(5, Math.min(95, center.cx + r * Math.cos(theta) + (Math.random() - 0.5) * 6));
          const y = Math.max(5, Math.min(95, center.cy + r * Math.sin(theta) + (Math.random() - 0.5) * 6));
          points.push({
            id: `${center.id}-${i}`,
            x: parseFloat(x.toFixed(2)),
            y: parseFloat(y.toFixed(2)),
            clusterId: center.id,
            clusterName: center.label,
            quote: center.quote,
            volume: Math.floor(Math.random() * 800) + 120,
            confidence: Math.floor(Math.random() * 30) + 70
          });
        }
      });
      return points;
    };

    const DISCOVERY_POINTS = generateClusterPoints();

    // Archetype opportunities
    const INITIAL_ARCHETYPES = [
      { id: 1, archetype: 'Fuzzy Place & Atmospheric Memory', stage: 'F2/F3', frequency: 89, severity: 92, ai_fit: 94, strat_fit: 88, sampleQuery: '"that candlelit patio we visited near the olive trees"', volume: '438K queries/mo', status: 'High Opportunity' },
      { id: 2, archetype: 'Utility Ephemeral Text / Receipts', stage: 'F3/F4', frequency: 78, severity: 88, ai_fit: 91, strat_fit: 82, sampleQuery: '"wifi password card taped to hotel desk"', volume: '312K queries/mo', status: 'High Opportunity' },
      { id: 3, archetype: 'Co-Event & Episode Reasoning', stage: 'F2/F5', frequency: 71, severity: 80, ai_fit: 86, strat_fit: 92, sampleQuery: '"pictures before my luggage got lost at airport"', volume: '275K queries/mo', status: 'Strategic Asset' },
      { id: 4, archetype: 'Sensory / Mood / Lighting Cues', stage: 'F3/F5', frequency: 62, severity: 74, ai_fit: 84, strat_fit: 76, sampleQuery: '"gloomy rain on windshield in parking lot"', volume: '198K queries/mo', status: 'Investigating' },
      { id: 5, archetype: 'Multi-person Temporal Anchoring', stage: 'F4/F6', frequency: 65, severity: 69, ai_fit: 79, strat_fit: 85, sampleQuery: '"uncle Dave laughing with coffee mug"', volume: '220K queries/mo', status: 'In Roadmap' },
      { id: 6, archetype: 'Hardware / Device Settings Captures', stage: 'F3/F4', frequency: 54, severity: 82, ai_fit: 88, strat_fit: 68, sampleQuery: '"thermostat wiring diagram on basement wall"', volume: '144K queries/mo', status: 'Quick Win' },
    ];

    // Vocabulary mismatches
    const QUERY_MISMATCH_DATA = [
      {
        id: 'QM-101',
        userQuery: 'car repair bill from last spring',
        actualMetadata: 'Text in image: "OFFICIAL AUTOMOTIVE INVOICE #8491 - TRANSMISSION WORK"',
        mismatchType: 'Synonym / Formality Gap',
        confidenceDrop: '-48%',
        severity: 'High',
        recommendation: 'Expand OCR taxonomy with colloquial financial synonyms ("bill" ↔ "invoice" ↔ "receipt")'
      },
      {
        id: 'QM-102',
        userQuery: 'dog wearing party hat',
        actualMetadata: 'Vision labels: "Canine, Mammal, Carnivore, Paper cone, Birthday decor"',
        mismatchType: 'Compositional Binding Failure',
        confidenceDrop: '-62%',
        severity: 'Critical',
        recommendation: 'Implement spatial object-attribute relation verification in multimodal retriever'
      },
      {
        id: 'QM-103',
        userQuery: 'menu from that greek place by the pier',
        actualMetadata: 'Image geolocation: 37.794, -122.393. Text: "Taverna Souvlaki & Mezze"',
        mismatchType: 'Spatial Anchor Unmapped to Cuisine',
        confidenceDrop: '-39%',
        severity: 'Medium',
        recommendation: 'Link Knowledge Graph POI entities (Greek restaurant) to geo-bounding clusters'
      },
      {
        id: 'QM-104',
        userQuery: 'blue prescription bottle with allergy pills',
        actualMetadata: 'Vision tags: "Plastic cylinder, Cobalt amber container, Cetirizine 10mg"',
        mismatchType: 'Generic vs Pharmacological Name',
        confidenceDrop: '-54%',
        severity: 'High',
        recommendation: 'Inject medical/common-name semantic aliases into utility OCR index'
      }
    ];

    // Main App Shell Component
    function App() {
      const [currentTab, setCurrentTab] = useState('overview');
      const [dateRange, setDateRange] = useState('Last 30 Days');
      const [aiWeight, setAiWeight] = useState(60);
      const [stratWeight, setStratWeight] = useState(40);
      const [activeClusterFilter, setActiveClusterFilter] = useState('all');
      const [hoveredPoint, setHoveredPoint] = useState(null);
      const [selectedFunnelStep, setSelectedFunnelStep] = useState(FUNNEL_DATA[2]); // F3
      const [searchFilter, setSearchFilter] = useState('');

      // Calculated Opportunity Score
      const sortedArchetypes = useMemo(() => {
        return [...INITIAL_ARCHETYPES].map(item => {
          // Dynamic calculation based on interactive sliders
          // Score = (Frequency * 0.2) + (Severity * 0.2) + (AI_Fit * (aiWeight/100) * 0.3) + (Strat_Fit * (stratWeight/100) * 0.3)
          const normalizedAi = (item.ai_fit * (aiWeight / 50));
          const normalizedStrat = (item.strat_fit * (stratWeight / 50));
          const totalScore = Math.round(
            (item.frequency * 0.25) + 
            (item.severity * 0.25) + 
            (normalizedAi * 0.25) + 
            (normalizedStrat * 0.25)
          );
          return {
            ...item,
            totalScore: Math.min(99, Math.max(10, totalScore))
          };
        }).sort((a, b) => b.totalScore - a.totalScore);
      }, [aiWeight, stratWeight]);

      // Filtered points for Discovery Map
      const filteredPoints = useMemo(() => {
        if (activeClusterFilter === 'all') return DISCOVERY_POINTS;
        return DISCOVERY_POINTS.filter(p => p.clusterId === parseInt(activeClusterFilter));
      }, [activeClusterFilter]);

      return (
        <div className="flex min-h-screen bg-[#06060c] text-slate-100 font-sans">
          
          {/* LEFT SIDEBAR NAVIGATION */}
          <aside className="w-64 border-r border-white/[0.08] bg-[#090a16]/90 backdrop-blur-2xl flex flex-col fixed inset-y-0 z-40">
            {/* Brand Logo & Tag */}
            <div className="p-5 border-b border-white/[0.08] flex items-center justify-between">
              <div className="flex items-center gap-3">
                <div className="w-9 h-9 rounded-xl bg-gradient-to-br from-purple-500 via-indigo-600 to-pink-500 flex items-center justify-center shadow-lg shadow-purple-500/25 ring-1 ring-white/20">
                  <svg className="w-5 h-5 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    <path d="M11 8v6M8 11h6" opacity="0.8"></path>
                  </svg>
                </div>
                <div>
                  <h1 className="font-bold text-base tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-white via-slate-100 to-purple-300">
                    RecallScope
                  </h1>
                  <p className="text-[10px] font-mono tracking-wider text-purple-400 uppercase font-medium">
                    Failure Intel v2.4
                  </p>
                </div>
              </div>
              <span className="w-2 h-2 rounded-full bg-emerald-400 glow-dot animate-pulse"></span>
            </div>

            {/* Navigation Tabs */}
            <nav className="p-3 space-y-1 flex-1 overflow-y-auto">
              <div className="px-3 py-2 text-[10px] font-mono tracking-wider uppercase text-slate-400 font-semibold">
                Analytics Core
              </div>
              
              {[
                { id: 'overview', label: 'Overview Dashboard', icon: 'M3 3h7v7H3zM14 3h7v7h-7zM14 14h7v7h-7zM3 14h7v7H3z', badge: null },
                { id: 'funnel', label: 'Funnel Leak Analysis', icon: 'M2 4h20l-8 9v7l-4-2v-5L2 4z', badge: '85.6% Leak' },
                { id: 'memory', label: 'Memory Lenses', icon: 'M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 18a8 8 0 1 1 8-8 8 8 0 0 1-8 8z', badge: 'Cognitive' },
                { id: 'discovery', label: 'Discovery Map (UMAP)', icon: 'M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6', badge: '240 clusters' },
                { id: 'opportunity', label: 'Opportunity Scoring', icon: 'M18 20V10M12 20V4M6 20v-6', badge: 'Dynamic' },
                { id: 'querylab', label: 'Query Lab & Mismatch', icon: 'M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4', badge: 'New' },
                { id: 'hypothesis', label: 'Hypothesis Court', icon: 'M12 3v18M3 9l9-6 9 6M3 15l9 6 9-6', badge: 'PRD Ready' }
              ].map(tab => {
                const isActive = currentTab === tab.id;
                return (
                  <button
                    key={tab.id}
                    onClick={() => setCurrentTab(tab.id)}
                    className={`w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-xs font-medium transition-all group ${
                      isActive 
                        ? 'bg-gradient-to-r from-purple-600/30 to-indigo-600/10 text-white border border-purple-500/40 shadow-sm shadow-purple-900/30' 
                        : 'text-slate-400 hover:text-slate-200 hover:bg-white/[0.04]'
                    }`}
                  >
                    <div className="flex items-center gap-2.5">
                      <svg 
                        className={`w-4 h-4 transition-colors ${isActive ? 'text-purple-400' : 'text-slate-400 group-hover:text-slate-300'}`} 
                        viewBox="0 0 24 24" 
                        fill="none" 
                        stroke="currentColor" 
                        strokeWidth="2" 
                        strokeLinecap="round" 
                        strokeLinejoin="round"
                      >
                        <path d={tab.icon}></path>
                      </svg>
                      <span>{tab.label}</span>
                    </div>
                    {tab.badge && (
                      <span className={`text-[9px] px-1.5 py-0.5 rounded-md font-mono ${
                        isActive ? 'bg-purple-500/30 text-purple-200' : 'bg-white/[0.06] text-slate-400'
                      }`}>
                        {tab.badge}
                      </span>
                    )}
                  </button>
                );
              })}

              <div className="pt-6 px-3 py-2 text-[10px] font-mono tracking-wider uppercase text-slate-400 font-semibold">
                Engine Telemetry
              </div>
              <div className="glass-panel p-3 rounded-xl mx-1 text-xs space-y-2">
                <div className="flex justify-between text-[11px]">
                  <span className="text-slate-400">Total Analyzed Sessions</span>
                  <span className="font-mono text-purple-300 font-semibold">1,420,800</span>
                </div>
                <div className="flex justify-between text-[11px]">
                  <span className="text-slate-400">Recall Precision</span>
                  <span className="font-mono text-amber-400">14.4% (Severe)</span>
                </div>
                <div className="w-full bg-white/10 h-1.5 rounded-full overflow-hidden">
                  <div className="bg-gradient-to-r from-purple-500 to-pink-500 h-full w-[14.4%]"></div>
                </div>
                <div className="text-[10px] text-slate-400 flex items-center gap-1.5 pt-1">
                  <span className="inline-block w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
                  Model: Gemini-Vision 1.5 Pro + UMAP v4
                </div>
              </div>
            </nav>

            {/* Sidebar Footer User / Org */}
            <div className="p-3 border-t border-white/[0.08] bg-[#070812]">
              <div className="flex items-center gap-3 px-2 py-1.5 rounded-lg hover:bg-white/[0.04] transition-colors cursor-pointer">
                <div className="w-8 h-8 rounded-full bg-gradient-to-tr from-purple-600 to-blue-500 p-[1.5px]">
                  <div className="w-full h-full rounded-full bg-[#0d0e1c] flex items-center justify-center text-xs font-semibold text-purple-300">
                    GP
                  </div>
                </div>
                <div className="flex-1 min-w-0">
                  <p className="text-xs font-medium text-slate-200 truncate">Google Photos AI PM</p>
                  <p className="text-[10px] text-slate-400 font-mono truncate">recall-eng@google.com</p>
                </div>
                <svg className="w-4 h-4 text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                  <path d="M18 15l-6-6-6 6"></path>
                </svg>
              </div>
            </div>
          </aside>

          {/* MAIN WORKSPACE CONTENT */}
          <div className="flex-1 ml-64 flex flex-col min-h-screen">
            
            {/* TOP BAR */}
            <header className="h-16 border-b border-white/[0.08] bg-[#090a16]/75 backdrop-blur-xl sticky top-0 z-30 px-8 flex items-center justify-between">
              <div className="flex items-center gap-4">
                <div className="flex items-center gap-2 text-xs font-mono text-slate-400">
                  <span className="text-purple-400">Project</span>
                  <span>/</span>
                  <span className="text-slate-200 font-medium">Visual Search Failures</span>
                  <span>/</span>
                  <span className="text-purple-300 font-semibold uppercase">{currentTab}</span>
                </div>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono bg-purple-500/20 text-purple-300 border border-purple-500/30">
                  Production Sandbox
                </span>
              </div>

              {/* Global Filters & Actions */}
              <div className="flex items-center gap-3">
                {/* Search Bar */}
                <div className="relative">
                  <svg className="w-3.5 h-3.5 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                  </svg>
                  <input
                    type="text"
                    placeholder="Search queries, archetypes..."
                    value={searchFilter}
                    onChange={(e) => setSearchFilter(e.target.value)}
                    className="bg-white/[0.05] border border-white/[0.1] rounded-lg pl-9 pr-4 py-1.5 text-xs text-slate-200 placeholder-slate-400 focus:outline-none focus:border-purple-500/60 focus:ring-1 focus:ring-purple-500/30 w-56 transition-all"
                  />
                </div>

                {/* Date Range Selector */}
                <div className="flex items-center bg-white/[0.05] border border-white/[0.1] rounded-lg p-1 text-xs">
                  {['7D', 'Last 30 Days', 'Q3 Benchmark'].map((range) => (
                    <button
                      key={range}
                      onClick={() => setDateRange(range)}
                      className={`px-2.5 py-1 rounded-md transition-all text-[11px] font-medium ${
                        dateRange === range
                          ? 'bg-purple-600 text-white shadow-sm'
                          : 'text-slate-400 hover:text-slate-200'
                      }`}
                    >
                      {range}
                    </button>
                  ))}
                </div>

                {/* Export / Action */}
                <button 
                  onClick={() => alert("Exporting Synthesis Pack: PRD-ready hypotheses & semantic embeddings generated.")}
                  className="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white text-xs font-medium shadow-md shadow-purple-900/40 border border-purple-400/30 transition-all hover:scale-[1.02] active:scale-[0.98]"
                >
                  <svg className="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"></path>
                  </svg>
                  <span>Export Synthesis</span>
                </button>
              </div>
            </header>

            {/* SCROLLABLE MAIN CONTENT AREA */}
            <main className="flex-1 p-8 space-y-8 overflow-y-auto max-w-[1600px] w-full mx-auto">

                          </td>

                          {/* Total Recalculated Score */}
                          <td className="py-3.5 px-4 text-right">
                            <span className="inline-flex items-center gap-1 font-mono text-base font-bold text-amber-300 px-2.5 py-1 rounded-lg bg-amber-500/10 border border-amber-500/30">
                              {arch.totalScore}
                              <span className="text-[10px] text-amber-400/70 font-normal">/100</span>
                            </span>
                          </td>

                          {/* Status Badge */}
                          <td className="py-3.5 px-4">
                            <span className={`text-[10px] font-mono px-2 py-1 rounded-full font-medium ${
                              arch.status === 'High Opportunity' ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/30' :
                              arch.status === 'Strategic Asset' ? 'bg-purple-500/20 text-purple-300 border border-purple-500/30' :
                              'bg-white/10 text-slate-300'
                            }`}>
                              {arch.status}
                            </span>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>

              {/* 4. QUERY LAB (VOCABULARY MISMATCH BENCHMARK) */}
              <div className="glass-panel p-6 rounded-2xl">
                <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6">
                  <div>
                    <div className="flex items-center gap-2.5">
                      <h3 className="text-base font-bold text-white flex items-center gap-2">
                        <span className="w-2.5 h-2.5 rounded-sm bg-sky-400"></span>
                        Query Lab: Vocabulary & Perception Mismatch
                      </h3>
                      <span className="px-2 py-0.5 rounded text-[10px] font-mono bg-sky-500/20 text-sky-300 border border-sky-500/30">
                        Top Disconnects
                      </span>
                    </div>
                    <p className="text-xs text-slate-400 mt-0.5">
                      Side-by-side juxtaposition of human query phrasing against computer vision metadata tags
                    </p>
                  </div>
                  <span className="text-xs font-mono text-slate-400">
                    Showing 4 Critical Production Test Cases
                  </span>
                </div>

                <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
                  {QUERY_MISMATCH_DATA.map((item) => (
                    <div key={item.id} className="glass-card-interactive p-4 rounded-xl flex flex-col justify-between">
                      <div>
                        {/* Header badge */}
                        <div className="flex items-center justify-between text-xs mb-3">
                          <span className="font-mono text-[11px] text-purple-400 font-semibold">{item.id}</span>
                          <div className="flex items-center gap-2">
                            <span className="text-[10px] font-mono px-2 py-0.5 rounded bg-red-500/20 text-red-300 border border-red-500/30">
                              Confidence Drop: {item.confidenceDrop}
                            </span>
                            <span className="text-[10px] font-mono px-2 py-0.5 rounded bg-white/10 text-slate-300">
                              {item.mismatchType}
                            </span>
                          </div>
                        </div>

                        {/* Side by side comparison */}
                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-3">
                          <div className="bg-white/[0.04] p-3 rounded-lg border border-white/[0.08]">
                            <span className="text-[10px] font-mono uppercase text-slate-400 block mb-1">User Attempted Query</span>
                            <p className="text-xs text-amber-200 font-mono font-medium">
                              "{item.userQuery}"
                            </p>
                          </div>
                          <div className="bg-white/[0.04] p-3 rounded-lg border border-white/[0.08]">
                            <span className="text-[10px] font-mono uppercase text-slate-400 block mb-1">Actual Vision / OCR Extracted</span>
                            <p className="text-xs text-sky-200 font-mono">
                              {item.actualMetadata}
                            </p>
                          </div>
                        </div>
                      </div>

                      {/* Prescribed Resolution */}
                      <div className="pt-3 border-t border-white/[0.06] flex items-start gap-2 text-xs">
                        <span className="text-emerald-400 font-mono text-sm mt-[-2px]">↳</span>
                        <p className="text-[11px] text-slate-300">
                          <strong className="text-emerald-300">Engine Fix:</strong> {item.recommendation}
                        </p>
                      </div>
                    </div>
                  ))}
                </div>
              </div>

              {/* 5. HYPOTHESIS COURT (PRD READINESS) */}
              <div className="glass-panel p-6 rounded-2xl border-purple-500/30">
                <div className="flex items-center justify-between mb-4">
                  <div className="flex items-center gap-2.5">
                    <h3 className="text-base font-bold text-white flex items-center gap-2">
                      <span className="w-2.5 h-2.5 rounded-sm bg-purple-400"></span>
                      Hypothesis Court: Next Actions for Engineering
                    </h3>
                    <span className="px-2 py-0.5 rounded text-[10px] font-mono bg-purple-500/20 text-purple-300">
                      Auto-Synthesized from Top Leaks
                    </span>
                  </div>
                  <button 
                    onClick={() => alert("Creating Jira tickets and Figma briefs for the Top 3 Hypotheses.")}
                    className="text-xs font-mono px-3 py-1.5 rounded-lg bg-white/10 hover:bg-white/15 text-slate-200 border border-white/20 transition-all"
                  >
                    Send to Jira / Sprint Planner →
                  </button>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-3 gap-4 text-xs">
                  <div className="p-4 rounded-xl bg-purple-950/30 border border-purple-500/30 space-y-2">
                    <div className="flex items-center justify-between text-purple-300 font-mono text-[10px]">
                      <span>Hypothesis #01</span>
                      <span className="text-emerald-400">+22.4% Projected Recall</span>
                    </div>
                    <h4 className="font-bold text-white">Vibe & Ambience Embedding Re-ranker</h4>
                    <p className="text-slate-400 text-[11px] leading-relaxed">
                      Train a cross-attention layer linking perceptual descriptors ("candlelight", "dimly lit", "foggy", "cozy") directly to global image color histogram and lighting warmth vectors.
                    </p>
                    <div className="pt-2 text-[10px] font-mono text-slate-400 flex items-center justify-between border-t border-white/10">
                      <span>Owner: Vision-Core Team</span>
                      <span className="text-purple-300">Priority: P0</span>
                    </div>
                  </div>

                  <div className="p-4 rounded-xl bg-sky-950/30 border border-sky-500/30 space-y-2">
                    <div className="flex items-center justify-between text-sky-300 font-mono text-[10px]">
                      <span>Hypothesis #02</span>
                      <span className="text-emerald-400">+14.1% Projected Recall</span>
                    </div>
                    <h4 className="font-bold text-white">Hierarchical OCR Fuzzy Taxonomy</h4>
                    <p className="text-slate-400 text-[11px] leading-relaxed">
                      Expand utility text indexing with semantic synonyms so colloquial queries ("bill", "receipt", "account number") auto-match formal document headers ("Invoice", "Statement").
                    </p>
                    <div className="pt-2 text-[10px] font-mono text-slate-400 flex items-center justify-between border-t border-white/10">
                      <span>Owner: Document AI Team</span>
                      <span className="text-sky-300">Priority: P1</span>
                    </div>
                  </div>

                  <div className="p-4 rounded-xl bg-pink-950/30 border border-pink-500/30 space-y-2">
                    <div className="flex items-center justify-between text-pink-300 font-mono text-[10px]">
                      <span>Hypothesis #03</span>
                      <span className="text-emerald-400">+18.7% Projected Recall</span>
                    </div>
                    <h4 className="font-bold text-white">Episodic Temporal Clustering</h4>
                    <p className="text-slate-400 text-[11px] leading-relaxed">
                      Allow users to search relative to milestones ("photos right before our Munich flight was delayed") by mining calendar metadata and clustered burst timestamps.
                    </p>
                    <div className="pt-2 text-[10px] font-mono text-slate-400 flex items-center justify-between border-t border-white/10">
                      <span>Owner: Graph Search Team</span>
                      <span className="text-pink-300">Priority: P1</span>
                    </div>
                  </div>
                </div>
              </div>

            </main>
          </div>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
